name: Build Windows Executable (.exe)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller onnxruntime joblib scikit-learn pandas numpy

      - name: Build Python Backend Executable (PyInstaller)
        run: |
          pyinstaller --clean purifier_backend.spec

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Build Electron App (.exe)
        run: |
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PuriFier-Radar-Windows-Exe
          path: |
            dist-electron/*.exe
          retention-days: 14
